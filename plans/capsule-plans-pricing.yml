specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Capsule
providerId: capsule
generated: '2026-09-05'
method: searched
source: https://capsulecrm.com/pricing
source_note: >-
  https://capsulecrm.com/pricing 302-redirects to https://capsulecrm.com/signup/,
  which renders the plan table. Replaces the 2026-05-04 scaffold, whose
  capsule-free / capsule-pro / capsule-enterprise tiers and per-request
  quotas were invented and do not exist.
created: '2026-05-04'
modified: '2026-09-05'
plan_count: 5
billing:
  model: per-user-per-month
  periods:
  - monthly
  - annual
  annual_discount: 'Save up to 14% (stated on the plan table)'
  trial: 14-day free trial on paid plans, no card required
  currency: USD
pricing_capture_note: >-
  The per-user prices are injected client-side on the pricing page and are not
  present in the served HTML, so no price is asserted here. Every tier below
  carries price: null with the quota and feature limits that ARE published in
  the markup. Free is the one tier whose price is published as such.
api_access_note: >-
  API access is not sold as a separate plan or metered product. The v2 REST
  API is available to accounts on every tier; the published rate limit is a
  flat 4,000 requests per user per hour and is not tiered. Two capabilities
  ARE plan-gated: multiple sales pipelines and project boards (Growth and
  above), and the Capsule MCP server private beta (Growth and above).
