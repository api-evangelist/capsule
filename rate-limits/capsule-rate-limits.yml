specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Capsule
providerId: capsule
generated: '2026-09-05'
method: searched
source: https://developer.capsulecrm.com/v2/overview/handling-api-responses
created: '2026-05-04'
modified: '2026-09-05'
description: >-
  Published rate limits for the Capsule v2 REST API. Replaces the 2026-05-04
  scaffold, whose per-tier numbers were invented defaults - Capsule publishes
  ONE limit, and it is not tiered by plan.
limit_count: 1
headers:
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  reset: X-RateLimit-Reset
  retryAfter: null
  policy: null
header_note: >-
  Returned on all successful requests. X-RateLimit-Reset is an epoch-seconds
  value; the docs instruct clients to wait until that time before retrying.
  Capsule does not document a Retry-After or RateLimit-Policy header.
responseCodes:
  throttled: 429
  quotaExceeded: 429
limits:
- name: Bearer token hourly quota
  scope: per-user
  scope_note: >-
    "Each Capsule user can make up to 4,000 requests per hour" when
    authenticating with a Bearer token. The window is per authenticated
    Capsule user, not per API key or per application.
  metric: requests_per_hour
  limit: 4000
  burst: null
  timeFrame: hour
  observed_header_value: 'X-RateLimit-Limit: 4000'
  applies:
  - Capsule v2 REST API
policies:
- name: Reset-header backoff
  description: >-
    On 429, wait until the epoch second in X-RateLimit-Reset before issuing
    another request. Capsule states this explicitly rather than publishing a
    backoff curve.
- name: Avoid polling
  description: >-
    Capsule directs high-frequency integrations to REST Hooks rather than
    polling. See asyncapi/capsule-rest-hooks-webhooks.yml.
  docs: https://developer.capsulecrm.com/v2/overview/avoid-polling-with-rest-hooks
notes:
- >-
  No per-plan rate tiers are published. The Free/Starter/Growth/Advanced/
  Ultimate plans differ on contact counts and features, not on API rate.
- >-
  Rate limiting was introduced 18 September 2015 per the developer changelog,
  "with the limits set high so as not to break existing integrations".
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
