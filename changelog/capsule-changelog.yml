entries:
- date: '2026-08-19'
  breaking: false
  breaking_note: >-
    Breaking only for integrations that PARSE the facehub URL; opaque
    consumers are unaffected, which Capsule states explicitly.
  highlights:
  - >-
    Facehub service retired. Party.pictureURL now returns a static default
    image (cdn.capsulecrm.com/.../person.svg) instead of a generated
    facehub.appspot.com URL when the party has no uploaded avatar.
- date: '2026-04-15'
  breaking: false
  additions:
  - Capsule MCP Server
  highlights:
  - >-
    Local MCP (Model Context Protocol) server released as a private beta.
    Read-only access to parties, opportunities, tasks and projects for
    MCP-compatible tools (Claude for Desktop, Cursor). Runs as a local Docker
    container; data does not pass through an external server.
- date: '2026-03-23'
  breaking: false
  additions:
  - Tracks on Parties
  highlights:
  - >-
    Documented support for adding Tracks to Parties, matching existing Track
    support on Opportunities and Projects.
- date: '2025-11-17'
  breaking: false
  additions:
  - Multi-Select List Field Definition
  - Multi-Select List Field Value
  highlights:
  - Support for creating and using multi-select list custom fields.
- date: '2025-10-08'
  breaking: false
  additions:
  - Goals
  highlights:
  - >-
    Goals documentation published - create, update and delete Goals.
    Available on Starter plans and above.
- date: '2024-04-17'
  breaking: false
  additions:
  - Track Definition create/update/delete
  highlights:
  - Documentation for managing the templates behind Track instances.
- date: '2022-06-30'
  breaking: false
  highlights:
  - >-
    Cases renamed as Projects across the product. "The API remains unchanged
    and existing integrations will be unaffected. All endpoints will continue
    to use the kases naming scheme." Board and Stage endpoints documented.
- date: '2022-03-31'
  breaking: false
  highlights:
  - >-
    Track task definition docs updated - assigning track tasks to specific
    users, excluding weekends from day gaps.
- date: '2021-08-23'
  breaking: false
  additions:
  - Multiple sales pipelines
  highlights:
  - Multiple sales pipelines for Growth plan accounts and above.
- date: '2015-09-18'
  breaking: false
  highlights:
  - >-
    Rate limiting introduced, "with the limits set high so as not to break
    existing integrations".
