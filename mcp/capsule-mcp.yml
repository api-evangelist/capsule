generated: '2026-09-05'
method: searched
source: https://zestia.github.io/capsule-mcp-scala/
name: Capsule MCP Server
status: published
description: >-
  First-party Model Context Protocol server for Capsule CRM, published by
  Zestia Ltd (the company that operates Capsule - the capsulecrm.com CAA
  record names caa-iodef@zestia.com, and the repository is Apache-2.0 under
  github.com/zestia). Announced on the Capsule developer changelog on
  15 April 2026 as a private beta. It is a LOCAL server: an AI assistant runs
  it as a Docker container over stdio on the operator's own machine, and it
  calls the Capsule v2 REST API directly with a personal API token. There is
  no hosted/remote MCP endpoint an agent can POST to.
deployment:
  mode: local-stdio
  endpoint: null
  install: 'docker run -i --rm -e CAPSULE_API_TOKEN=your-api-token ghcr.io/zestia/capsule-mcp-scala:latest'
  package: https://github.com/zestia/capsule-mcp-scala
  auth: api-key
  verified: searched
  note: >-
    Install string copied verbatim from the quickstart config block at
    https://zestia.github.io/capsule-mcp-scala/ (mcpServers.capsule-mcp.args).
    mcp.capsulecrm.com and https://api.capsulecrm.com/mcp were both probed and
    are NOT MCP endpoints - the former redirects to a Google sign-in page, the
    latter returns the api host's HTML "account does not exist" shell with a
    200. No remote endpoint was found, so mode is local-stdio, not both.
access:
  beta: true
  beta_note: >-
    Private beta. Early access is requested from inside a Capsule account
    (Integrations > "Capsule MCP Server" > Request early access). Capsule's
    blog states Growth plan and above, free during the beta.
  plan_requirement: Growth or above
  clients_supported:
  - Claude Desktop
  - Cursor
  read_only: true
  read_only_evidence: >-
    "This server currently only supports read-only access and cannot be used
    to modify your Capsule data." - https://zestia.github.io/capsule-mcp-scala/
repository:
  url: https://github.com/zestia/capsule-mcp-scala
  language: Scala 3
  license: Apache-2.0
  documented_version: 0.1.0
  last_pushed: '2026-05-01'
  image: ghcr.io/zestia/capsule-mcp-scala:latest
  first_party: true
  first_party_evidence: >-
    Published under github.com/zestia; Zestia Ltd operates Capsule. The Capsule
    developer changelog (15 April 2026) announces the same server, and the
    docs site zestia.github.io/capsule-mcp-scala is the one the README points at.
runtime:
  transport: stdio
  container: docker
  env:
  - name: CAPSULE_API_TOKEN
    required: true
    description: >-
      Capsule personal API token created at My Preferences > API
      Authentication Tokens, scoped to "Read information from your Capsule
      account" only.
  - name: CAPSULE_BASE_URL
    required: false
    default: https://api.capsulecrm.com
    description: Override to target a different Capsule instance.
