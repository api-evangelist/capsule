description: >-
  Binds each tool published by the first-party Capsule MCP server to the
  Capsule v2 REST operation that backs it. The MCP server is a read-only
  projection over the same api.capsulecrm.com/api/v2 surface, so every tool
  has a REST ancestor - but the REST surface is much wider, because the MCP
  server exposes no writes at all.
surfaces:
  openapi:
  - openapi/capsule-parties-api-openapi.yml
  - openapi/capsule-opportunities-api-openapi.yml
  - openapi/capsule-projects-api-openapi.yml
  - openapi/capsule-tasks-api-openapi.yml
  openapi_note: >-
    The OpenAPI files in this repo are a hand-authored API Evangelist
    representation of the published documentation - Capsule publishes no
    OpenAPI of its own (probed 2026-09-05: /openapi.json, /openapi.yaml,
    /swagger.json on api.capsulecrm.com return the host's HTML shell with a
    200; developer.capsulecrm.com 404s). They carry NO operationId values, so
    the rest[] bindings below are METHOD + PATH, not operationIds.
  graphql: null
  mcp:
    url: null
    transport: stdio
    gated: true
    gated_reason: >-
      Local Docker server in private beta; no anonymous endpoint exists, so
      tools/list could not be called and inputSchema could not be read.
